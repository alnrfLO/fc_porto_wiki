name: App de bureau

# sa construit l app windows et linux puis sa la publie dans une release github
# a chaque tag de version (genre : git tag v1.0.1 && git push origin v1.0.1)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construire:
    name: Construire (${{ matrix.cible }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            cible: windows
          - os: ubuntu-latest
            cible: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Version de l'app depuis le tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run ${{ matrix.cible }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.cible }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  publier:
    name: Publier la release
    needs: construire
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
          merge-multiple: true
      - name: Créer la release avec les installeurs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Installer FC Porto Wiki

          - **Windows** : télécharge `FC-Porto-Wiki-Setup.exe` et lance-le. L'app n'étant pas signée, Windows peut afficher « Windows a protégé votre ordinateur » : clique sur « Informations complémentaires », puis « Exécuter quand même ».
          - **Linux** : `FC-Porto-Wiki.AppImage` (rends le fichier exécutable, puis lance-le) ou `fc-porto-wiki_amd64.deb` pour Debian, Ubuntu et dérivés.
          - **Téléphone** : ouvre https://fc-porto-wiki.vercel.app et touche « Installer l'app ».

          L'app affiche le site en ligne : elle est donc toujours à jour, et les pages déjà consultées restent disponibles hors ligne.
          EOF
          # si la release existe deja je remplace juste les fichiers, sinon je la cree
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" fichiers/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" fichiers/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "FC Porto Wiki $GITHUB_REF_NAME" \
              --notes-file notes.md
          fi
